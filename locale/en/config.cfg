oil-special-processing-r1=Unlocks special heavy oil, light oil, and petroleum gas processing.
plastics-r1=Unlocks the Plastic R1 recipe.
refinery-machine-r1=Unlocks the Refinery and basic heavy and light oil processing.
refinery-machine-r2=Unlocks the Advanced Refinery.

beacon-r1=Unlock a new Beacon.
machinery-r1=Unlocks the Compact Craft Machine.
machinery-r2=Unlocks the Craft Machine.
machinery-r3=Unlocks the Advanced Craft Machine.

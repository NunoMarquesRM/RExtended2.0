adv-ore-processing-r1=Unlocks the Heat Forge and Casting Chamber, plus molten metal and advanced plate recipes.
adv-ore-processing-r2=Unlocks the Advanced Casting Chamber and Advanced Heat Forge.
adv-products-r1=Unlocks recipes for the Electronic Component R1 and Energy Cable.
adv-water-r2=Unlocks the Advanced Water Condenser.
clean-products-r1=Unlocks the Compressor, Washing Chamber, Pressurized Water, and clean metal processing recipes.
initial-products-r1=Unlocks reinforced materials, including the Reinforced Component, Reinforced Coal Plate, and reinforced gears.

[technology-description]
# Energy
electric-energy-poles-r1=Unlocks new Light, Medium, and Long Poles.
electric-energy-poles-r2=Unlock a Huge Substation.
energy-accumulator-r1=Unlock the new Accumulator R2 and Battery R1.
energy-accumulator-r2=Unlock the new Accumulator R3.
solar-panel-equipment-tech-r2=Unlock the new Portable Solar Panel R2.
solar-energy-r2=Unlock the Solar Cell and Solar Panel R2.
solar-energy-r3=Unlock the Solar Panel R3.
solar-energy-r4=Unlock the Solar Panel R4.
solar-energy-r5=Unlock the Solar Panel R5.
steam-energy-r1=Unlocks a Boiler R2 and Steam Engine R2 for generating power from steam.
steam-energy-r2=Unlocks a Boiler R3 and Steam Engine R3 for generating power from steam.

charcoal-r1=Transform wood to coal.
refined-coal-r1=Unlocks Clean Coal processing and an alternative Glue recipe.
refined-coal-r2=Unlocks Infused Coal processing.
diesel-energy-r1=Unlocks Enriched Coal, Diesel Fuel, and the Enrichment Chamber R1.


# Machinery
warehouse-tech=Unlock an elite warehouse.
big-storage-tank-r1=Unlock a new 100K Storage Tank.
big-storage-tank-r2=Unlock a new 500K Storage Tank.
elite-storage-tank-r3=Unlock a new 5M Storage Tank.
electric-mining-r2=Unlock a new Electric Mining Drill R2.
electric-mining-r3=Unlock a new Electric Mining Drill R3.
electric-furnace-r1=Unlock a new Electric Furnace R1.
electric-furnace-r2=Unlock a new Electric Furnace R2.
adv-chemical-machine-r1=Unlocks the Chemical Machine R1.
adv-chemical-machine-r2=Unlocks the Chemical Machine R2.
adv-clean-products-r2=Unlocks the Compressor R2 and Washer Chamber R2.
adv-formation-furnace-r1=Unlocks the Electric Formation Furnace and an alternative Clean Steel recipe.
adv-machinery-r2=Unlocks the Little Craft Machine R2.
adv-ore-processing-r1=Unlocks the Heat Forge R1 and Cast Chamber R1, plus molten metal and advanced plate recipes.
adv-ore-processing-r2=Unlocks the Cast Chamber R2 and Heat Forge R2.
adv-products-r1=Unlocks recipes for the Electronic Component R1 and Energy Cable.
adv-water-r2=Unlocks the Water Condenser R2.
clean-products-r1=Unlocks the Compressor R1, Washer Chamber R1, Pressurized Water, and clean metal processing recipes.
initial-products-r1=Unlocks reinforced materials, including the Reinforced Component, Reinforced Coal Plate, and reinforced gears.
mixer-products-r1=Unlocks the Mixer R1 and recipes for Glue and reinforced iron and copper plates.
silicon-processing=Unlocks recipes for Blue Quartz and Crystalline Silicon.
water-product-r1=Unlocks the Water Condenser R1 and recipes for Water R1, Air Purifier, Pure Air, and Purificator Tools.
lithium-r1=Unlocks Lithium processing, Molten Coal, and Enriched Petroleum.
oil-advanced-processing-r1=Unlocks advanced heavy oil, light oil, and petroleum gas processing.
oil-special-processing-r1=Unlocks special heavy oil, light oil, and petroleum gas processing.
plastics-r1=Unlocks the Plastic R1 recipe.
refinery-machine-r1=Unlocks the Refinery R1 and basic heavy and light oil processing.
refinery-machine-r2=Unlocks the Refinery R2.

beacon-r1=Unlock a new Beacon.
machinery-r1=Unlocks the Little Craft Machine R1.
machinery-r2=Unlocks the Craft Machine R1.
machinery-r3=Unlocks the Craft Machine R2.
centrifuge-tech-r2=Unlocks the Centrifuge R2, a high-speed centrifuge for advanced nuclear processing.
steel-processing-r2=Unlock the Steel Plate Circuit.

# Railworld
electric-railway-r1=Unlocks an electric locomotive, a workshop locomotive, and a control station that supplies power to the rails.
electric-railway-r2=Unlocks the Electric Train R2.
electric-railway-r3=Unlocks the Electric Train R3.
sonic-tech-r1=Unlock a Sonic Train R1.
sonic-tech-r2=Unlock a Sonic Train R2.
sonic-tech-r3=Unlock a Sonic Train R3.
railway-r1=Unlocks Cargo Wagon R1 (150) and Fluid Wagon R1 (50k).
railway-r2=Unlocks Cargo Wagon R2 (250) and Fluid Wagon R2 (125k).
railway-r3=Unlocks specialized wagons for transporting copper, iron, stone, coal, and uranium.

# Robots
red-robots=Unlocks upgraded construction and logistic robots, a roboport, and red storage chests.
worker-robot-battery-1=Increases worker robot battery capacity by 20% per research level.
worker-robot-battery-4=Increases worker robot battery capacity by 20% per research level.
worker-robot-battery-8=Increases worker robot battery capacity by 20% per research level.
worker-robot-battery-12=Increases worker robot battery capacity by 20% per research level.
worker-robot-battery=Increases the battery size of worker robots.

# Military
laser-turret-r2=Unlocks the Laser Turret R2.
exoskeleton-tech-r2=Unlocks the R2 exoskeleton, which provides a 100% movement speed bonus.


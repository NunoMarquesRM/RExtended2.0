red-build-distance-bonus=Aumenta o alcance de construção até 100 000 quadrados. Defina como 0 para desativar este bónus. Valor recomendado: 150.
red-reach-distance-bonus=Aumenta o alcance de interação até 100 000 quadrados. Defina como 0 para desativar este bónus. Valor recomendado: 150.
red-resource-reach-distance-bonus=Aumenta o alcance de extração de recursos até 100 000 quadrados. Defina como 0 para desativar este bónus. Valor recomendado: 150.
red-item-drop-distance-bonus=Aumenta o alcance para largar itens até 1 000 quadrados. Defina como 0 para desativar este bónus. Valor recomendado: 150.
red-item-pickup-distance-bonus=Aumenta o alcance para recolher itens do chão e das esteiras até 100 quadrados. Defina como 0 para desativar este bónus. Valor recomendado: 0.

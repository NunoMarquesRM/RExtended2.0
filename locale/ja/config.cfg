[technology-description]
# Energy
electric-energy-poles-r1=「先進街灯」、「拡張中型電柱」、「拡張大型電柱」のロックを解除します。
electric-energy-poles-r2=「先進変電所」のロックを解除します。
energy-accumulator-r1=「先進蓄電池」と「バッテリー R1」のロックを解除します。
energy-accumulator-r2=「大容量蓄電池」のロックを解除します。
solar-panel-equipment-tech-r2=ポータブルソーラーパネル R2 をアンロックします。
solar-energy-r2=ソーラーパネルと改良ソーラーパネルをアンロックします。
solar-energy-r3=先進ソーラーパネルをアンロックします。
solar-energy-r4=上級ソーラーパネルをアンロックします。
solar-energy-r5=究極ソーラーパネルをアンロックします。
steam-energy-r1=蒸気から電力を生成するための「先進ボイラー」と「先進蒸気機関」をアンロックします。
steam-energy-r2=蒸気から電力を生成するための「工業用ボイラー」と「高出力蒸気機関」をアンロックします。

charcoal-r1=木材を石炭に精製する。
refined-coal-r1=「純石炭」の加工と、「接着剤」のレシピが解放されます。
refined-coal-r2=「強化石炭」の加工が解放されます。
diesel-energy-r1=「濃縮石炭」、「ディーゼル燃料」、および「濃縮室 R1」が解放されます。


# Machinery
warehouse-tech=上級倉庫をアンロックします。
big-storage-tank-r1=容量100,000ユニットの大型貯蔵タンクをアンロックします。
big-storage-tank-r2=容量500,000ユニットの「先進貯蔵タンク」をアンロックします。
elite-storage-tank-r3=容量500万ユニットの「上級貯蔵タンク」をアンロックします。
electric-mining-r2=「先進電動採掘機」をアンロックします。
electric-mining-r3=上級電動採掘機をアンロックします。
electric-furnace-r1=電気炉 R1 をアンロックします。
electric-furnace-r2=電気炉 R2 をアンロックします。
adv-chemical-machine-r1=ケミカルマシン をアンロックします。
adv-chemical-machine-r2=先進ケミカルマシン をアンロックします。
adv-clean-products-r2=高圧コンプレッサーと先進洗浄室をアンロックします。
adv-formation-furnace-r1=電気成形炉と、「純鋼」のレシピをアンロックします。
adv-machinery-r2=先進コンパクトクラフトマシンをアンロックします。
adv-ore-processing-r1=熱鍛造炉と鋳造室、および溶融金属と先進プレートレシピのロックを解除します。
adv-ore-processing-r2=先進鋳造室と先進熱鍛造炉のロックを解除します。
adv-products-r1=電子部品R1とエネルギーケーブルのレシピのロックを解除します。
adv-water-r2=先進水凝縮器のロックを解除します。
clean-products-r1=コンプレッサー、洗浄槽、加圧水、および洗浄金属の製造レシピが解放されます。
initial-products-r1=強化部品、強化石炭板、強化歯車などの強化素材が解放されます。
mixer-products-r1=ミキサーR1、および接着剤、強化鉄板、強化銅板の製造レシピが解放されます。
silicon-processing=「ブルークォーツ」および「結晶シリコン」のレシピをアンロックします。
water-product-r1=「水凝縮器」および「水 R1」、「空気清浄機」、「純空気」、「クリーンツール」のレシピをアンロックします。
lithium-r1=リチウム加工、溶融石炭、および濃縮石油のレシピをアンロックします。
oil-advanced-processing-r1=先進重油、軽油、および石油ガスの加工レシピをアンロックします。
oil-special-processing-r1=特殊重油、軽油、および石油ガスの加工がアンロックされます。
plastics-r1=プラスチックR1のレシピがアンロックされます。
refinery-machine-r1=精製所と、基本的な重油および軽油の加工がアンロックされます。
refinery-machine-r2=先進精製所がアンロックされます。

beacon-r1=新しいビーコンのロックを解除します。
machinery-r1=コンパクトクラフトマシンのロックを解除します。
machinery-r2=クラフトマシンのロックを解除します。
machinery-r3=先進クラフトマシンのロックを解除します。
centrifuge-tech-r2=先進核処理用の高速遠心分離機「遠心分離機 R2」のロックを解除します。
steel-processing-r2=鋼板回路をアンロックします。

# Railworld
electric-railway-r1=電気機関車、整備用機関車、およびレールに電力を供給する制御ステーションのロックを解除します。
electric-railway-r2=電気列車 R2 をアンロックします。
